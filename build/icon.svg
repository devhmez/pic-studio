<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- PIC Studio app icon: a DIP-18 chip (the PIC16F84A package) carrying a small organigramme that ends on a lit
       LED, on a teal macOS squircle. Original artwork; rendered to build/icon.icns by scripts/build-icon.mjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17a394"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0a5650"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3236"/>
      <stop offset="1" stop-color="#14191c"/>
    </linearGradient>
    <linearGradient id="pinL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7f8"/>
      <stop offset="1" stop-color="#b9c4ca"/>
    </linearGradient>
    <radialGradient id="led" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="0.35" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f05a28"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ff8a3d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#04211e" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.3" markerHeight="3.3" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e6fffb"/>
    </marker>
  </defs>

  <!-- macOS squircle (824 px on the 1024 grid) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#sheen)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" ry="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
  </g>

  <!-- 9 + 9 pins (0.1 in pitch, drawn at 50 px) -->
  <g fill="url(#pinL)">
    <rect x="248" y="294" width="76" height="26" rx="6"/>
    <rect x="248" y="344" width="76" height="26" rx="6"/>
    <rect x="248" y="394" width="76" height="26" rx="6"/>
    <rect x="248" y="444" width="76" height="26" rx="6"/>
    <rect x="248" y="494" width="76" height="26" rx="6"/>
    <rect x="248" y="544" width="76" height="26" rx="6"/>
    <rect x="248" y="594" width="76" height="26" rx="6"/>
    <rect x="248" y="644" width="76" height="26" rx="6"/>
    <rect x="248" y="694" width="76" height="26" rx="6"/>
    <rect x="700" y="294" width="76" height="26" rx="6"/>
    <rect x="700" y="344" width="76" height="26" rx="6"/>
    <rect x="700" y="394" width="76" height="26" rx="6"/>
    <rect x="700" y="444" width="76" height="26" rx="6"/>
    <rect x="700" y="494" width="76" height="26" rx="6"/>
    <rect x="700" y="544" width="76" height="26" rx="6"/>
    <rect x="700" y="594" width="76" height="26" rx="6"/>
    <rect x="700" y="644" width="76" height="26" rx="6"/>
    <rect x="700" y="694" width="76" height="26" rx="6"/>
  </g>

  <!-- package -->
  <g filter="url(#chipShadow)">
    <rect x="300" y="250" width="424" height="514" rx="30" fill="url(#body)"/>
  </g>
  <rect x="301.5" y="251.5" width="421" height="511" rx="28.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
  <!-- orientation notch and pin-1 dot -->
  <path d="M478 251 A34 34 0 0 0 546 251 Z" fill="#0b0f11"/>
  <circle cx="346" cy="300" r="11" fill="#3c474d"/>

  <!-- organigramme: Début → action → test ; « non » lights the LED, « oui » loops back -->
  <g fill="none" stroke="#e6fffb" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="512" cy="322" r="24"/>
    <path d="M512 346 V 384" marker-end="url(#arrow)"/>
    <path d="M512 474 V 512" marker-end="url(#arrow)"/>
    <path d="M512 630 V 676 H 390 V 429 H 424" marker-end="url(#arrow)"/>
    <path d="M582 571 H 606" />
  </g>
  <rect x="432" y="398" width="160" height="62" rx="12" fill="#2dd4bf" stroke="#e6fffb" stroke-width="9"/>
  <path d="M512 520 L 582 571 L 512 622 L 442 571 Z" fill="#7dd3fc" stroke="#e6fffb" stroke-width="9" stroke-linejoin="round"/>

  <!-- the LED, lit -->
  <circle cx="640" cy="571" r="78" fill="url(#glow)"/>
  <circle cx="640" cy="571" r="30" fill="url(#led)" stroke="#fff4d6" stroke-width="5"/>
</svg>
